<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LanText · 电脑输入</title>
<style>
body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f3f5f9;color:#17243a;margin:0}main{max-width:1000px;margin:36px auto;padding:24px}h1{margin-bottom:8px}.card{background:white;border-radius:16px;padding:24px;margin:20px 0;box-shadow:0 4px 20px #1427440c}.info{display:flex;gap:36px;flex-wrap:wrap}strong{font-size:24px}textarea{box-sizing:border-box;width:100%;min-height:340px;border:1px solid #bec9d9;border-radius:10px;padding:16px;font-size:24px;line-height:1.5;resize:vertical}button{background:#245fde;color:white;border:0;padding:11px 18px;border-radius:8px;font-size:16px;cursor:pointer}button.secondary{background:#e9eef8;color:#24509b}.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:16px}.muted{color:#617089;font-size:14px}#status{font-weight:600}code{font-size:24px;letter-spacing:4px}.error{color:#ba243b}
</style></head><body><main><h1>LanText</h1><div class="muted">电脑输入文字，iPad 自动显示 · 同一 Wi-Fi</div>
<section class="card info"><div>电脑 IPv4 / 端口<br><strong id="address">正在读取…</strong></div><div>配对码<br><code id="code">—</code></div><div>在线设备<br><strong id="clients">0</strong></div><button class="secondary" id="rotate">更换配对码</button></section>
<section class="card"><label for="text">显示文字（中文、多行，输入后自动同步）</label><p></p><textarea id="text" placeholder="在这里输入要显示的文字…" spellcheck="false" disabled></textarea><div class="bar"><button id="clear">清空文字</button><span id="status" role="status" aria-live="polite">连接中…</span><span id="size" class="muted"></span></div></section>
<p class="muted">iPad 中输入上方 IPv4、端口和配对码。更换配对码后，已有设备须重新配对。文字只保存在电脑内存中，关闭服务后清空。</p></main><script src="/app.js"></script></body></html>
