<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LanText 实时文字</title><link rel="stylesheet" href="/viewer.css"><script src="/viewer.js" defer></script></head><body><header><strong>电脑写什么，iPad 就显示什么</strong><span id="status" role="status">未连接</span></header><section id="settings"><form id="pair"><label>电脑上的 8 位配对码 <input id="code" type="password" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required autocomplete="off"></label><button>连接</button></form><div class="tools"><label>字号 <input id="size" type="range" min="18" max="160" value="48"><output id="sizeValue">48</output></label><button id="full">全屏显示</button><button id="disconnect">断开连接</button></div><small id="wake">保持此页面打开。电脑和 iPad 需要连接同一个 Wi-Fi。</small></section><main id="text" aria-live="polite"></main><button id="exit" hidden>退出全屏</button></body></html>
