name: Build and test LanText
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop with embedded viewer
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -OutputPath "$PWD/LanText-Web.exe"
      - name: Test native service
        shell: pwsh
        run: |
          $p = Start-Process ./LanText-Web.exe -ArgumentList '--self-test', "$PWD/test-result.txt" -Wait -PassThru
          Get-Content test-result.txt
          if ($p.ExitCode -ne 0) { throw 'Native tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: LanText-Web-Windows
          path: LanText-Web.exe
          if-no-files-found: error
